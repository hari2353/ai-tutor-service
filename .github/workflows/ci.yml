name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dev-only dependencies (pytest; numpy for the HNSW/attention labs)
        run: python -m pip install pytest numpy

      # One command runs every layer: data rebuild -> DOM/state (25) ->
      # SM-2 (10) -> review gate (461 modules) -> security scan ->
      # unit (11) + integration (5) -> every lab suite in labs/ across
      # py, go, rust, ts and java plus misc (~860 cases).
      - name: Full suite (app\tests\run.ps1)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File app\tests\run.ps1
