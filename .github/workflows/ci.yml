name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dev-only dependencies (pytest; numpy for the HNSW/attention labs)
        run: python -m pip install pytest numpy

      # One command runs every layer: data rebuild -> DOM/state (25) ->
      # SM-2 (10) -> review gate (454 modules) -> security scan ->
      # unit (11) + integration (5) -> all lab suites (~400 cases).
      - name: Full suite (app\tests\run.ps1)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File app\tests\run.ps1
